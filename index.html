<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سؤال 💌</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg,#ffdde1,#ee9ca7);
    font-family:'Tahoma','Segoe UI',sans-serif;
    overflow:hidden;
    position:relative;
  }

  /* المظروف */
  #envelope-wrap {
    cursor:pointer;
    text-align:center;
    user-select:none;
    transition: transform 0.3s;
    z-index:5;
  }
  #envelope-wrap:hover { transform: scale(1.05); }

  .envelope {
    width:220px;
    height:150px;
    background:#fff;
    border:2px solid #e28fa3;
    border-radius:10px;
    position:relative;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
    overflow:visible;
  }
  .envelope::before {
    content:"";
    position:absolute;
    top:0; left:0;
    width:0; height:0;
    border-left:110px solid transparent;
    border-right:110px solid transparent;
    border-top:80px solid #f7b6c2;
    z-index:2;
    transition: transform 0.5s ease;
    transform-origin: top;
  }
  .envelope::after {
    content:"";
    position:absolute;
    bottom:0; left:0;
    width:0; height:0;
    border-left:110px solid transparent;
    border-right:110px solid transparent;
    border-bottom:75px solid #ffc9d4;
    z-index:1;
  }
  .envelope.open::before {
    transform: rotateX(180deg);
  }
  .heart-seal {
    position:absolute;
    top:55px; left:50%;
    transform:translateX(-50%);
    font-size:28px;
    z-index:3;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%,100% { transform:translateX(-50%) scale(1); }
    50% { transform:translateX(-50%) scale(1.15); }
  }
  #hint {
    margin-top:20px;
    color:#7a2e3d;
    font-size:16px;
    font-weight:bold;
  }

  /* الورقة */
  #letter {
    display:none;
    background:#fffdf7;
    width:90%;
    max-width:420px;
    padding:35px 25px;
    border-radius:14px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
    text-align:center;
    position:relative;
    z-index:6;
    animation: popUp 0.5s ease;
  }
  @keyframes popUp {
    from { transform: scale(0.5) translateY(60px); opacity:0; }
    to { transform: scale(1) translateY(0); opacity:1; }
  }
  #letter h1 {
    color:#c2185b;
    font-size:26px;
    margin-bottom:25px;
  }
  .btns {
    display:flex;
    gap:15px;
    justify-content:center;
    margin-bottom:15px;
    position: relative;
    min-height: 60px;
  }
  .btns button {
    padding:12px 25px;
    font-size:17px;
    border:none;
    border-radius:30px;
    cursor:pointer;
    font-weight:bold;
    transition: transform 0.3s ease, background 0.3s ease;
  }
  .btns button:active { transform: scale(0.92); }
  #yesBtn {
    background:#e91e63;
    color:#fff;
    box-shadow:0 5px 15px rgba(233,30,99,0.4);
  }
  #noBtn {
    background:#f0f0f0;
    color:#555;
  }
  #oops {
    display:none;
    margin-top:10px;
    color:#555;
    font-size:16px;
  }
  #oops .emoji { font-size:40px; display:block; margin-bottom:5px; line-height:1.3; }

  /* رسالة الحب النهائية */
  #finalMsg {
    display:none;
    position:fixed;
    inset:0;
    align-items:center;
    justify-content:center;
    z-index:20;
    text-align:center;
  }
  #finalMsg .msg-box {
    color:#c2185b;
    font-size:28px;
    font-weight: bold;
    text-shadow:0 3px 10px rgba(255,255,255,0.8);
    background:rgba(255,255,255,0.9);
    padding:25px 35px;
    border-radius:20px;
    animation: popUp 0.6s ease;
    max-width: 90%;
  }

  /* تصميم زر المتابعة والقلب للواتساب */
  .whatsapp-btn {
    display: inline-block;
    margin-top: 18px;
    padding: 12px 30px;
    background: #25d366;
    color: #fff;
    font-size: 19px;
    font-weight: bold;
    text-decoration: none;
    border-radius: 30px;
    box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
    transition: transform 0.3s ease;
  }
  .whatsapp-btn:active { transform: scale(0.92); }

  .heart-fall {
    position:fixed;
    top:-40px;
    font-size:24px;
    pointer-events:none;
    z-index:15;
    animation-name: fall;
    animation-timing-function: linear;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); opacity:0.2; }
  }
</style>
</head>
<body>

  <div id="envelope-wrap" onclick="openEnvelope()">
    <div class="envelope" id="envelope">
      <div class="heart-seal">❤️</div>
    </div>
    <div id="hint">اضغط على المظروف 💌</div>
  </div>

  <div id="letter">
    <h1 id="question">انت بتحبني؟ 🥹</h1>
    <div class="btns">
      <button id="yesBtn" onclick="handleYesClick()">أيوة ❤️</button>
      <button id="noBtn" onclick="sayNo()">لا</button>
    </div>
    <div id="oops">
      <span class="emoji" id="oopsEmoji">😢</span>
      <span id="oopsText"></span>
    </div>
  </div>

  <div id="finalMsg">
    <div class="msg-box" id="msgContent"></div>
  </div>

<script>
  function openEnvelope(){
    const env = document.getElementById('envelope');
    env.classList.add('open');
    setTimeout(()=>{
      document.getElementById('envelope-wrap').style.display='none';
      document.getElementById('letter').style.display='block';
    }, 450);
  }

  let noCount = 0;
  let isBamooutActive = false;
  let yesMoveCount = 0;
  let noX = 0, noY = 0;
  let yesX = 0, yesY = 0;

  // دالة تحريك ذكية تمنع التداخل ولا تتعدى حدود الشاشة
  function moveButtonSafely(movingBtn, otherBtn) {
    let attempts = 0;
    let rx = 0, ry = 0;
    let success = false;

    while (attempts < 25) {
      rx = (Math.random() - 0.5) * 160;
      ry = (Math.random() - 0.5) * 90;

      let otherRect = otherBtn.getBoundingClientRect();
      let currentX = (movingBtn.id === 'noBtn') ? noX : yesX;
      let currentY = (movingBtn.id === 'noBtn') ? noY : yesY;

      let newX = currentX + rx;
      let newY = currentY + ry;

      let targetScreenX = (window.innerWidth / 2) + newX;
      let targetScreenY = (window.innerHeight / 2) + newY;

      // التأكد من عدم الخروج عن حدود الشاشة
      if (targetScreenX > 60 && targetScreenX < window.innerWidth - 60 &&
          targetScreenY > 60 && targetScreenY < window.innerHeight - 60) {
        
        let otherScreenX = otherRect.left + otherRect.width / 2;
        let otherScreenY = otherRect.top + otherRect.height / 2;

        let dist = Math.hypot((targetScreenX - otherScreenX), (targetScreenY - otherScreenY));
        if (dist > 110) { // مسافة أمان لمنع التداخل بين الزرين
          success = true;
          break;
        }
      }
      attempts++;
    }

    if (!success) {
      rx = (Math.random() > 0.5 ? 80 : -80);
      ry = (Math.random() > 0.5 ? 40 : -40);
    }

    if (movingBtn.id === 'noBtn') {
      noX += rx;
      noY += ry;
      movingBtn.style.transform = `translate(${noX}px, ${noY}px)`;
    } else {
      yesX += rx;
      yesY += ry;
      movingBtn.style.transform = `translate(${yesX}px, ${yesY}px)`;
    }
  }

  function sayNo(){
    const emojiEl = document.getElementById('oopsEmoji');
    const textEl = document.getElementById('oopsText');
    const oopsBox = document.getElementById('oops');
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');

    noCount++;
    if (noCount <= 3) {
      moveButtonSafely(noBtn, yesBtn);
      oopsBox.style.display = 'none';
    } 
    else if (noCount === 4) {
      moveButtonSafely(noBtn, yesBtn);
      emojiEl.textContent = '🤔';
      textEl.textContent = 'طب فكر تاني';
      oopsBox.style.display = 'block';
    } 
    else if (noCount === 5) {
      moveButtonSafely(noBtn, yesBtn);
      emojiEl.textContent = '🤨';
      textEl.textContent = 'متأكد؟';
      oopsBox.style.display = 'block';
    } 
    else if (noCount === 6) {
      moveButtonSafely(noBtn, yesBtn);
      emojiEl.textContent = '🙄';
      textEl.textContent = 'انت متمسك برايك اوي';
      oopsBox.style.display = 'block';
    } 
    else {
      oopsBox.style.display = 'none';
      noBtn.textContent = '💖 بموووت فيك يا احمودي ❤️';
      noBtn.style.background = '#e91e63';
      noBtn.style.color = '#fff';
      noBtn.style.boxShadow = '0 5px 15px rgba(233,30,99,0.4)';
      noBtn.style.transform = 'translate(0px, 0px)';
      noX = 0; noY = 0;
      isBamooutActive = true; 
      noBtn.onclick = sayBamoout; 
    }
  }

  function handleYesClick(){
    const yesBtn = document.getElementById('yesBtn');
    const noBtn = document.getElementById('noBtn');

    if (!isBamooutActive) {
      showFinalMessage(`وأنا كمان بحبك ❤️😍<br><a href="https://wa.me/201061496331" class="whatsapp-btn" target="_blank">متابعة ❤️</a>`);
    } else {
      yesMoveCount++;
      if (yesMoveCount <= 6) {
        moveButtonSafely(yesBtn, noBtn);
      } else {
        yesBtn.textContent = '🔥 بعشق امك يا احمود 🔥';
        yesBtn.style.background = '#c2185b';
        yesBtn.style.transform = 'translate(0px, 0px)';
        yesX = 0; yesY = 0;
        yesBtn.onclick = sayBaashq; 
      }
    }
  }

  function sayBamoout(){
    showFinalMessage('وأنا كمان بموت فيكي يا روحي ❤️💖');
  }

  function sayBaashq(){
    showFinalMessage('وأنا بعشق عيلتك كلها 🔥❤️');
  }

  function showFinalMessage(htmlContent){
    document.getElementById('letter').style.display='none';
    document.getElementById('msgContent').innerHTML = htmlContent;
    fillHearts();
    setTimeout(()=>{
      document.getElementById('finalMsg').style.display='flex';
    }, 500);
  }

  function fillHearts(){
    const hearts = ['❤️','💖','💕','💗','💓','😍'];
    const count = 80;
    for(let i=0; i<count; i++){
      setTimeout(()=>{
        const h = document.createElement('div');
        h.className='heart-fall';
        h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
        h.style.left = Math.random()*100 + 'vw';
        const duration = 2 + Math.random()*2.5;
        h.style.animationDuration = duration + 's';
        h.style.fontSize = (16 + Math.random()*22) + 'px';
        document.body.appendChild(h);
        setTimeout(()=>h.remove(), duration*1000 + 200);
      }, i*45);
    }
    setInterval(()=>{
      const h = document.createElement('div');
      h.className='heart-fall';
      const hearts2 = ['❤️','💖','💕'];
      h.textContent = hearts2[Math.floor(Math.random()*hearts2.length)];
      h.style.left = Math.random()*100 + 'vw';
      const duration = 3 + Math.random()*2;
      h.style.animationDuration = duration + 's';
      h.style.fontSize = (16 + Math.random()*20) + 'px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), duration*1000 + 200);
    }, 300);
  }
</script>

</body>
</html>
